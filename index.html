<script>
// Todo dentro de una función: el panel que se abre después declara sus propias constantes globales
// («const $», «const KEY»…) y chocarían con cualquier global que dejara esta página.
(() => {
 "use strict";
 const GUARDADA = "islasol-llave-v1";
 const $ = id => document.getElementById(id);
 const C = JSON.parse($("cifrado").textContent);
 const bytes = s => Uint8Array.from(atob(s), ch => ch.charCodeAt(0));
 const b64 = a => { let s = ""; for (const x of a) s += String.fromCharCode(x); return btoa(s); };
 // igual que en cifrar.mjs: da igual mayúsculas, tildes, guiones o espacios
 const norm = s => s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]+/g, " ").trim();
 async function derivar(clave) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(norm(clave)), "PBKDF2", false, ["deriveBits"]);
  return new Uint8Array(await crypto.subtle.deriveBits({name: "PBKDF2", hash: "SHA-256", salt: bytes(C.sal), iterations: C.it}, base, 256));
 }
 async function descifrar(llave) {
  const k = await crypto.subtle.importKey("raw", llave, "AES-GCM", false, ["decrypt"]);
  return new TextDecoder().decode(await crypto.subtle.decrypt({name: "AES-GCM", iv: bytes(C.iv)}, k, bytes(C.datos)));
 }
 function entrar(html, llave, recordar) {
  try { if (recordar) localStorage.setItem(GUARDADA, b64(llave)); } catch (e) {}
  if (!location.hash || /^#k=/.test(location.hash)) history.replaceState(null, "", location.pathname + location.search + "#inicio");
  document.open(); document.write(html); document.close();
 }
 function pedir(msg) {
  $("estado").textContent = "Escribe la clave para entrar.";
  $("form").hidden = false; $("err").textContent = msg || ""; $("clave").focus();
 }
 $("mostrar").addEventListener("change", e => { $("clave").type = e.target.checked ? "text" : "password"; });
 $("form").addEventListener("submit", async e => {
  e.preventDefault();
  const v = $("clave").value; if (!norm(v)) return;
  $("entrar").disabled = true; $("entrar").textContent = "Abriendo…"; $("err").textContent = "";
  let llave, html;
  try { llave = await derivar(v); html = await descifrar(llave); }
  catch (err) { $("entrar").disabled = false; $("entrar").textContent = "Entrar"; $("err").textContent = "Esa clave no es correcta. Prueba otra vez."; $("clave").select(); return; }
  entrar(html, llave, $("recordar").checked);
 });
 (async () => {
  if (!window.crypto || !crypto.subtle) { $("estado").textContent = "Este navegador no puede abrir la página. Ábrela con Chrome o Safari actualizados."; return; }
  const m = location.hash.match(/^#k=(.+)$/);
  if (m) {
   let llave, html;
   try { llave = await derivar(decodeURIComponent(m[1])); html = await descifrar(llave); }
   catch (e) { history.replaceState(null, "", location.pathname + location.search); return pedir("El enlace no trae la clave buena. Escríbela tú."); }
   return entrar(html, llave, true);
  }
  let g = null;
  try { g = localStorage.getItem(GUARDADA); } catch (e) {}
  if (g) {
   let html;
   try { html = await descifrar(bytes(g)); } catch (e) { try { localStorage.removeItem(GUARDADA); } catch (e2) {} }
   if (html) return entrar(html, bytes(g), true);
  }
  pedir();
 })();
})();
</script>
